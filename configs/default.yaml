# Default pipeline. Every key maps to localrag/config.py; override from the CLI with
#   --set retrieval.mode=dense --set agent.decompose=false
index_dir: index

llm:
  repo_id: unsloth/Qwen3.5-0.8B-GGUF
  filename: Qwen3.5-0.8B-Q8_0.gguf
  n_ctx: 8192
  enable_thinking: false

ingest:
  pdf_dir: documents
  parser: pymupdf              # pymupdf (hand-written heuristics) | docling
  child_size: 0                # >0 enables parent-child retrieval with children of this size
  chunk_size: 1200
  chunk_overlap: 200
  contextualize: false

retrieval:
  mode: hybrid                 # dense | sparse | hybrid
  sparse: bm25                 # bm25 | splade
  embedding_model: BAAI/bge-small-en-v1.5
  reranker_backend: cross_encoder   # cross_encoder | llama (Qwen3-Reranker via llama-server)
  reranker_model: BAAI/bge-reranker-v2-m3
  fetch_k: 20
  rerank_k: 20
  top_k: 5

agent:
  corpus_description: "US FDA regulations and guidance documents for medical devices (21 CFR 820 quality system regulation incl. design controls, software validation, off-the-shelf software, cybersecurity, AI/ML software as a medical device)."
  route: true
  decompose: true
  answer_mode: grounded        # grounded | grounded_evidence | freetext
  crag: false                  # corrective RAG: rewrite + re-retrieve on weak evidence
  min_relevance: 0.0           # refuse below this top reranker score (see: localrag calibrate)
  verifier: reranker           # none | reranker | nli
  support_threshold: 0.05
  self_correct: false

eval:
  dataset: eval/dataset.jsonl
  teacher:                     # writes the questions
    repo_id: unsloth/Qwen3.5-9B-GGUF
    filename: Qwen3.5-9B-Q4_K_M.gguf
  judge:                       # grades answers; a different model family from the generator
    repo_id: ggml-org/gemma-4-12B-it-GGUF
    filename: gemma-4-12B-it-Q4_0.gguf
    n_ctx: 16384
